<script src="notificacoes.js"></script>
<script>
  // Carregar perfil ativo
  var membroAtivo = JSON.parse(localStorage.getItem('membroAtivo') || 'null');
  var usuario = JSON.parse(localStorage.getItem('usuarioCuidar') || 'null');
  if(membroAtivo) {
    var emojis = { adulto:'👨', idoso:'👴', crianca:'👶' };
    document.getElementById('perfilEmoji').textContent = emojis[membroAtivo.tipo] || '👨';
    document.getElementById('perfilNome').textContent = membroAtivo.nome;
    document.getElementById('perfilTipo').textContent = membroAtivo.relacao || membroAtivo.tipo;
  } else if(usuario) {
    document.getElementById('perfilNome').textContent = usuario.nome;
    document.getElementById('perfilTipo').textContent = usuario.relacao || 'Admin';
  }

  // Verificar cadastro
  if(!localStorage.getItem('usuarioCuidar')){
    window.location.replace('cadastro.html');
  }

  // Carregar medicamentos do banco para o alarme global funcionar
  (function() {
    var familiaId = localStorage.getItem("familiaId") || "";
    var membroAtivo = JSON.parse(localStorage.getItem("membroAtivo") || "null");
    var membroId = membroAtivo ? membroAtivo.membroIdBanco : null;
    if(!familiaId) return;
    var chave = membroAtivo ? "medicamentos_" + membroAtivo.id : "medicamentos_usuario_principal";
    var url = membroId
      ? "/api/medicamentos/" + familiaId + "/" + membroId
      : "/api/medicamentos/" + familiaId;
    fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(r){
      if(r.ok && r.meds && r.meds.length > 0) {
        var meds = r.meds.map(function(m){
          return {
            id: m.id, dbId: m.id, nome: m.nome,
            dosagem: m.dosagem,
            horarios: m.horarios ? JSON.parse(m.horarios) : [],
            via: m.via, estoque: m.estoque,
            alertaEstoque: m.alerta_estoque,
            validade: m.validade, armazenamento: m.armazenamento,
            obs: m.obs, ativo: true
          };
        });
        localStorage.setItem(chave, JSON.stringify(meds));
      }
    }).catch(function(){});
  })();

  function reiniciarApp() {
    if(confirm('⚠️ ATENÇÃO\n\nAo reiniciar o app TODOS os dados serão apagados permanentemente:\n\n• Medicamentos e histórico\n• Cadastro familiar\n• Financeiro\n• Documentos e fotos\n• Todos os registros\n\nEsta ação NÃO pode ser desfeita.\n\nDeseja continuar?')) {
      localStorage.clear();
      alert('✅ Dados apagados! O app vai reiniciar.');
      window.location.replace('cadastro.html');
    }
  }
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="alarme_global.js"></script>
<script>

  // Listener para alarme disparado pelo SW (push em segundo plano)
  if("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", function(e) {
      if(e.data && e.data.tipo === "alarme") {
        var d = e.data.data || {};
        dispararAlarmeGlobal(d.med_nome || "Medicamento", d.med_dosagem || "", d.horario || "");
      }
    });
  }

  function dispararAlarmeGlobal(nome, dosagem, horario) {
    // Tocar som
    try {
      var ctx = new(window.AudioContext || window.webkitAudioContext)();
      function beep(freq,start,dur,vol){
        var osc=ctx.createOscillator(); var gain=ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value=freq; osc.type="sine";
        gain.gain.setValueAtTime(vol||0.3, ctx.currentTime+start);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
        osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur);
      }
      beep(880,0,0.15,0.4); beep(880,0.2,0.15,0.4); beep(1046,0.4,0.3,0.4);
      beep(880,0.8,0.15,0.4); beep(880,1.0,0.15,0.4); beep(1046,1.2,0.3,0.4);
      beep(880,1.6,0.15,0.4); beep(880,1.8,0.15,0.4); beep(1175,2.0,0.5,0.4);
    } catch(e){}
    if(navigator.vibrate) navigator.vibrate([500,200,500,200,500,200,1000]);
    // Falar o nome
    setTimeout(function(){
      if(!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var texto = "Atenção! Está na hora de tomar " + nome + ".";
      if(dosagem) texto += " A dose é " + dosagem + ".";
      texto += " Por favor tome o seu comprimido agora.";
      var fala = new SpeechSynthesisUtterance(texto);
      fala.lang="pt-BR"; fala.rate=0.9; fala.pitch=1; fala.volume=1;
      var vozes = window.speechSynthesis.getVoices();
      var vozPT = vozes.find(function(v){ return v.lang.indexOf("pt")!==-1; });
      if(vozPT) fala.voice = vozPT;
      window.speechSynthesis.speak(fala);
    }, 800);
    // Mostrar tela de alarme global
    var overlay = document.getElementById("alarme_med_global");
    if(!overlay) {
      overlay = document.createElement("div");
      overlay.id = "alarme_med_global";
      overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(26,35,126,0.97);z-index:99998;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;";
      document.body.appendChild(overlay);
    }
    overlay.innerHTML =
      "<div style="font-size:5em;margin-bottom:20px">💊</div>"+
      "<div style="color:white;font-size:1.4em;font-weight:bold;margin-bottom:10px">⏰ Hora do remédio!</div>"+
      "<div style="color:#90caf9;font-size:1.8em;font-weight:bold;margin-bottom:8px">"+nome+"</div>"+
      "<div style="color:white;font-size:1.1em;margin-bottom:8px;opacity:0.9">"+(dosagem?"Dose: "+dosagem:"")+"</div>"+
      "<div style="color:rgba(255,255,255,0.6);font-size:0.9em;margin-bottom:30px">🕐 Horário: "+horario+"</div>"+
      "<div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px">"+
        "<button onclick="fecharAlarmeRemedioGlobal()" style="padding:18px;background:#4caf50;color:white;border:none;border-radius:16px;font-size:1.1em;font-weight:bold;cursor:pointer">✅ Tomei agora!</button>"+
        "<button onclick="fecharAlarmeRemedioGlobal()" style="padding:14px;background:rgba(255,255,255,0.15);color:white;border:2px solid rgba(255,255,255,0.3);border-radius:16px;font-size:0.95em;cursor:pointer">😴 Lembrar em 15 min</button>"+
        "<button onclick="fecharAlarmeRemedioGlobal()" style="padding:14px;background:rgba(198,40,40,0.5);color:white;border:none;border-radius:16px;font-size:0.95em;cursor:pointer">⏭️ Vou pular essa dose</button>"+
      "</div>";
    overlay.style.display = "flex";
  }
  if("serviceWorker" in navigator && "PushManager" in window) {
    navigator.serviceWorker.register("/sw.js").then(function(reg) {
      console.log("CD+ SW registrado:", reg.scope);
      function registrarPush() {
        var vapidKey = "BIqsxSNZWDq9_p40w5AdKxnnEdd_TRIUgy2L5pc3DU5KojTXUiTPTv4NTR6luUAuWPMnkSmLkLHAQxGtQGIf-SA";
        var convertedKey = urlBase64ToUint8Array(vapidKey);
        reg.pushManager.getSubscription().then(function(existingSub) {
          if(existingSub) {
            return existingSub.unsubscribe();
          }
        }).then(function() {
          return reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: convertedKey
          });
        }).then(function(sub) {
          salvarSubscription(sub);
        }).catch(function(e){ console.log("Push sub erro:", e); });
      }
      function salvarSubscription(sub) {
        var membroAtivo = JSON.parse(localStorage.getItem("membroAtivo") || "null");
        var familiaId = localStorage.getItem("familiaId") || "";
        if(membroAtivo && familiaId && membroAtivo.membroIdBanco) {
          fetch("/api/push/subscribe", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
              membro_id: membroAtivo.membroIdBanco,
              familia_id: familiaId,
              subscription: sub
            })
          }).then(function(r){ return r.json(); })
          .then(function(r){ console.log("Push inscrito:", r); })
          .catch(function(e){ console.log("Push salvar erro:", e); });
        }
      }
      if(Notification.permission === "granted") {
        registrarPush();
      } else if(Notification.permission === "default") {
        Notification.requestPermission().then(function(p) {
          if(p === "granted") registrarPush();
        });
      }
    }).catch(function(e) { console.log("SW erro:", e); });
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = "=".repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    var rawData = window.atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for(var i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
    return outputArray;
  }
