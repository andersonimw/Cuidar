<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfis - Cuidar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:sans-serif; background:#f0f4f8; color:#333; }
  header { background:#2e7d32; color:white; padding:16px 20px; display:flex; align-items:center; gap:12px; }
  header a { color:white; text-decoration:none; font-size:1.4em; }
  header h1 { font-size:1.2em; flex:1; }
  .conteudo { padding:16px; padding-bottom:80px; }
  .info-box { background:#e8f5e9; border-left:4px solid #2e7d32; padding:12px 16px; border-radius:0 12px 12px 0; font-size:0.85em; color:#2e7d32; margin-bottom:16px; }
  .perfil-card { background:white; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.08); display:flex; align-items:center; gap:14px; border:3px solid transparent; }
  .perfil-card.ativo { border-color:#2e7d32; background:#f1f8f1; }
  .avatar { width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8em; flex-shrink:0; }
  .av-adulto { background:#e3f2fd; }
  .av-idoso { background:#fff3e0; }
  .av-crianca { background:#f3e5f5; }
  .info { flex:1; }
  .nome { font-weight:bold; font-size:1em; }
  .rel { font-size:0.8em; color:#888; margin-top:2px; }
  .tipo-badge { font-size:0.72em; padding:2px 8px; border-radius:20px; display:inline-block; margin-top:4px; }
  .tb-adulto { background:#e3f2fd; color:#1565c0; }
  .tb-idoso { background:#fff3e0; color:#e65100; }
  .tb-crianca { background:#f3e5f5; color:#6a1b9a; }
  .ativo-badge { background:#2e7d32; color:white; font-size:0.72em; padding:2px 10px; border-radius:20px; margin-left:4px; }
  .id-medico { margin-top:6px; background:#e8eaf6; border-radius:8px; padding:4px 10px; display:inline-flex; align-items:center; gap:6px; }
  .id-medico span { font-size:0.75em; color:#1a237e; font-family:monospace; letter-spacing:1px; }
  .id-medico button { background:none; border:none; cursor:pointer; font-size:0.85em; }
  .acoes { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .btn-sel { padding:8px 14px; background:#2e7d32; color:white; border:none; border-radius:8px; font-size:0.82em; cursor:pointer; }
  .btn-sel:disabled { background:#aaa; }
  .btn-exc { padding:8px 14px; background:#ffebee; color:#c62828; border:none; border-radius:8px; font-size:0.82em; cursor:pointer; }
  .btn-add { width:100%; padding:16px; background:white; border:2px dashed #2e7d32; color:#2e7d32; border-radius:16px; font-size:1em; cursor:pointer; margin-bottom:12px; font-weight:bold; }
  .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; align-items:flex-end; justify-content:center; }
  .modal.ativo { display:flex; }
  .modal-box { background:white; border-radius:24px 24px 0 0; padding:24px; width:100%; max-height:85vh; overflow-y:auto; }
  .modal-titulo { font-size:1.1em; font-weight:bold; color:#2e7d32; margin-bottom:16px; text-align:center; }
  .form-group { margin-bottom:14px; }
  .form-group label { font-size:0.85em; color:#555; font-weight:bold; display:block; margin-bottom:6px; }
  .form-group input, .form-group select { width:100%; padding:12px; border:1.5px solid #ddd; border-radius:10px; font-size:0.95em; outline:none; }
  .tipos-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
  .tipo-btn { padding:12px 8px; border:2px solid #eee; border-radius:12px; background:white; font-size:0.82em; cursor:pointer; text-align:center; }
  .tipo-btn .ti { font-size:1.8em; display:block; margin-bottom:4px; }
  .tipo-btn.sel { border-color:#2e7d32; background:#e8f5e9; color:#2e7d32; font-weight:bold; }
  .btn-salvar { width:100%; padding:16px; background:#2e7d32; color:white; border:none; border-radius:12px; font-size:1em; font-weight:bold; cursor:pointer; }
  .btn-cancelar { width:100%; padding:12px; background:#eee; color:#555; border:none; border-radius:12px; font-size:0.95em; cursor:pointer; margin-top:8px; }
  .loading { text-align:center; color:#888; padding:20px; }
</style>
</head>
<body>
<header>
  <a href="index.html">←</a>
  <h1>👥 Perfis Familiares</h1>
</header>
<div class="conteudo">
  <div class="info-box">💡 Selecione um perfil para gerenciar a saúde de cada membro separadamente.</div>
  <div id="listaPerfis"><div class="loading">Carregando perfis...</div></div>
  <button class="btn-add" onclick="abrirModal()">➕ Adicionar novo membro</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-titulo">➕ Novo Membro</div>
    <div class="form-group">
      <label>Nome completo *</label>
      <input type="text" id="pNome" placeholder="Ex: Maria Silva">
    </div>
    <div class="form-group">
      <label>Tipo *</label>
      <div class="tipos-grid">
        <button class="tipo-btn" onclick="selTipo(this,'adulto')"><span class="ti">👨</span>Adulto</button>
        <button class="tipo-btn" onclick="selTipo(this,'idoso')"><span class="ti">👴</span>Idoso</button>
        <button class="tipo-btn" onclick="selTipo(this,'crianca')"><span class="ti">👶</span>Criança</button>
      </div>
    </div>
    <div class="form-group">
      <label>Relação</label>
      <select id="pRelacao">
        <option>Pai/Mãe</option><option>Filho(a)</option><option>Avô/Avó</option>
        <option>Cônjuge</option><option>Irmão(ã)</option><option>Neto(a)</option><option>Outro</option>
      </select>
    </div>
    <div class="form-group">
      <label>Data de nascimento</label>
      <input type="date" id="pNascimento">
    </div>
    <button class="btn-salvar" onclick="salvarPerfil()">✅ Salvar</button>
    <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
  var familiaId = localStorage.getItem('familiaId') || '';
  var usuario = JSON.parse(localStorage.getItem('usuarioCuidar') || 'null');
  var membroAtivo = JSON.parse(localStorage.getItem('membroAtivo') || 'null');
  var tipoSel = '';
  var membrosDB = [];

  var emojis = { adulto:'👨', idoso:'👴', crianca:'👶' };
  var avClasses = { adulto:'av-adulto', idoso:'av-idoso', crianca:'av-crianca' };
  var tbClasses = { adulto:'tb-adulto', idoso:'tb-idoso', crianca:'tb-crianca' };
  var tbLabels = { adulto:'👨 Adulto', idoso:'👴 Idoso', crianca:'👶 Criança' };

  function calcIdade(nasc) {
    if(!nasc) return '';
    var d = new Date(nasc);
    var idade = new Date().getFullYear() - d.getFullYear();
    return ' · ' + idade + ' anos';
  }

  function renderizar() {
    var el = document.getElementById('listaPerfis');
    if(membrosDB.length === 0) {
      el.innerHTML = '<div class="loading">Nenhum membro ainda.</div>';
      return;
    }
    el.innerHTML = '';
    membrosDB.forEach(function(m) {
      var ativo = membroAtivo && membroAtivo.membroIdBanco === m.id;
      var tipo = m.tipo || 'adulto';
      var div = document.createElement('div');
      div.className = 'perfil-card' + (ativo ? ' ativo' : '');
      var idHtml = m.id_medico
        ? '<div class="id-medico"><span>🏥 ' + m.id_medico + '</span><button onclick="copiar(\'' + m.id_medico + '\')">📋</button></div>'
        : '<div style="font-size:0.75em;color:#aaa;margin-top:4px">Gerando ID médico...</div>';
      div.innerHTML =
        '<div class="avatar ' + avClasses[tipo] + '">' + emojis[tipo] + '</div>' +
        '<div class="info">' +
          '<div class="nome">' + m.nome + '</div>' +
          '<div class="rel">' + (m.relacao||'') + calcIdade(m.data_nascimento) + '</div>' +
          '<span class="tipo-badge ' + tbClasses[tipo] + '">' + tbLabels[tipo] + '</span>' +
          (ativo ? '<span class="ativo-badge">✓ Ativo</span>' : '') +
          idHtml +
        '</div>' +
        '<div class="acoes">' +
          '<button class="btn-sel" ' + (ativo?'disabled':'onclick="selecionar('+m.id+')"') + '>' + (ativo?'Ativo':'Selecionar') + '</button>' +
          (!m.admin ? '<button class="btn-exc" onclick="excluir('+m.id+',\''+m.nome+'\')">Excluir</button>' : '') +
        '</div>';
      el.appendChild(div);
    });
  }

  function selecionar(id) {
    var m = membrosDB.find(function(x){ return x.id === id; });
    if(!m) return;
    membroAtivo = {
      id: 'membro_' + m.id,
      membroIdBanco: m.id,
      nome: m.nome,
      tipo: m.tipo || 'adulto',
      relacao: m.relacao || '',
      idMedico: m.id_medico
    };
    localStorage.setItem('membroAtivo', JSON.stringify(membroAtivo));
    renderizar();
    alert('✅ Perfil de ' + m.nome + ' selecionado!\nOs módulos agora mostram os dados de ' + m.nome + '.');
  }

  function excluir(id, nome) {
    if(!confirm('Excluir perfil de ' + nome + '?')) return;
    fetch('/api/membros/excluir', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ id: id })
    }).then(function(){ carregarDB(); });
  }

  function copiar(id) {
    if(navigator.clipboard) navigator.clipboard.writeText(id).then(function(){ alert('ID copiado: ' + id); });
    else alert('ID médico: ' + id);
  }

  function carregarDB() {
    if(!familiaId) return;
    fetch('/api/membros/' + familiaId)
      .then(function(r){ return r.json(); })
      .then(function(r){
        if(r.ok && r.membros) {
          membrosDB = r.membros;
          renderizar();
        }
      }).catch(function(){ renderizar(); });
  }

  function selTipo(btn, tipo) {
    document.querySelectorAll('.tipo-btn').forEach(function(b){ b.classList.remove('sel'); });
    btn.classList.add('sel');
    tipoSel = tipo;
  }

  function abrirModal() { document.getElementById('modal').classList.add('ativo'); }
  function fecharModal() {
    document.getElementById('modal').classList.remove('ativo');
    document.getElementById('pNome').value = '';
    document.getElementById('pNascimento').value = '';
    document.querySelectorAll('.tipo-btn').forEach(function(b){ b.classList.remove('sel'); });
    tipoSel = '';
  }

  function salvarPerfil() {
    var nome = document.getElementById('pNome').value.trim();
    if(!nome){ alert('Digite o nome.'); return; }
    if(!tipoSel){ alert('Selecione o tipo.'); return; }
    fetch('/api/membros/salvar', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        familia_id: familiaId,
        nome: nome,
        relacao: document.getElementById('pRelacao').value,
        tipo: tipoSel,
        data_nascimento: document.getElementById('pNascimento').value || null,
        admin: false
      })
    }).then(function(r){ return r.json(); })
    .then(function(r){
      if(r.ok) {
        fecharModal();
        carregarDB();
        alert('✅ ' + nome + ' adicionado! ID médico: ' + (r.membro.id_medico||'gerando...'));
      }
    }).catch(function(){ alert('Erro ao salvar.'); });
  }

  carregarDB();
</script>
</body>
</html>
